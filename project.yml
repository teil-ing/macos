name: teil.ing-client
options:
  bundleIdPrefix: ing.teil
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5A7M476YY2
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "7"

targets:
  teil.ing-client:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    dependencies:
      - package: KeyboardShortcuts
    sources:
      - path: teil.ing-client/App
      - path: teil.ing-client/Views
      - path: teil.ing-client/Services
      - path: teil.ing-client/Onboarding
      - path: teil.ing-client/Models
      - path: teil.ing-client/Preferences
      - path: teil.ing-client/Resources
    info:
      path: teil.ing-client/Info.plist
      properties:
        CFBundleDisplayName: "teil.ing"
        CFBundleIdentifier: "ing.teil.client"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 ing.teil. All rights reserved."
    entitlements:
      path: teil.ing-client/App/teil_ing_client.entitlements
      properties:
        com.apple.security.hardened-runtime: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ing.teil.client
        PRODUCT_NAME: "teil.ing-client"
        INFOPLIST_FILE: teil.ing-client/Info.plist
        CODE_SIGN_ENTITLEMENTS: teil.ing-client/App/teil_ing_client.entitlements
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5A7M476YY2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  teil.ing-clientTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: teil.ing-client
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: ing.teil.clientTests
        GENERATE_INFOPLIST_FILE: YES
