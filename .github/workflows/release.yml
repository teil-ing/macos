name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Install tools
        run: brew install create-dmg

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          echo "${CERT_BASE64}" | base64 --decode > "${CERT_PATH}"

          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

          rm -f "${CERT_PATH}"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV

      - name: Prepare notarization credentials
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          ASC_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "${ASC_KEY_BASE64}" | base64 --decode > "${ASC_KEY_PATH}"
          echo "ASC_KEY_PATH=${ASC_KEY_PATH}" >> $GITHUB_ENV

      - name: Build, sign, notarize and package
        env:
          CODE_SIGN_IDENTITY: "Developer ID Application: Tillmann Hubner (5A7M476YY2)"
          NOTARIZE: "1"
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./build-dmg.sh "$VERSION"

      - name: Upload DMG to release
        run: gh release upload "v${VERSION}" "build/teil.ing-client-${VERSION}.dmg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish only after the DMG is attached. Releases are created as drafts so the
      # GitHub "latest" API never returns a version whose DMG is still building —
      # which would show the app an update with no installable asset.
      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload notarization log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-log
          path: build/notarization-log.json
          if-no-files-found: ignore

      - name: Clean up keychain and credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi
          rm -f "${RUNNER_TEMP}/AuthKey.p8" 2>/dev/null || true
